name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plateforme à builder"
        required: false
        default: all
        type: choice
        options: [all, android, ios]

jobs:
  build-android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Reconstitue le keystore de release (secret du repo) : sans lui, le
      # build "release" retombe sur la clé debug (cf. android/app/build.gradle.kts)
      # et produit un binaire non signé pour de vrai, inutilisable pour une
      # mise à jour ou une publication sur le Play Store.
      - name: Importe le keystore Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: le10000-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: le10000-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Importe les certificats Apple (distribution + development) et leurs
      # profils de provisionnement (secrets du repo) dans un trousseau macOS
      # temporaire, propre à ce run, pour que les archives puissent être
      # signées sans compte Apple connecté à Xcode.
      - name: Importe la signature Apple
        env:
          DIST_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          DIST_PROFILE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          DEV_P12_BASE64: ${{ secrets.IOS_DEV_P12_BASE64 }}
          DEV_P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
          DEV_PROFILE_BASE64: ${{ secrets.IOS_DEV_MOBILEPROVISION_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          DIST_CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          DIST_PROFILE_PATH="$RUNNER_TEMP/games.mobileprovision"
          DEV_CERTIFICATE_PATH="$RUNNER_TEMP/development.p12"
          DEV_PROFILE_PATH="$RUNNER_TEMP/games-dev.mobileprovision"

          echo -n "$DIST_P12_BASE64" | base64 --decode -o "$DIST_CERTIFICATE_PATH"
          echo -n "$DIST_PROFILE_BASE64" | base64 --decode -o "$DIST_PROFILE_PATH"
          echo -n "$DEV_P12_BASE64" | base64 --decode -o "$DEV_CERTIFICATE_PATH"
          echo -n "$DEV_PROFILE_BASE64" | base64 --decode -o "$DEV_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$DIST_CERTIFICATE_PATH" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$DEV_CERTIFICATE_PATH" -P "$DEV_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$DIST_PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/
          cp "$DEV_PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/

      - run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: le10000-ipa
          path: build/ios/ipa/*.ipa

      # Envoie le build App Store vers App Store Connect (TestFlight) via une
      # clé API dédiée (secrets du repo) — indépendant du compte Apple perso,
      # fonctionne donc aussi sans session Xcode connectée.
      - name: Envoie vers TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # Build signé avec le profil Development (inclut l'UDID d'un appareil de
      # test précis) : installable directement par USB via ideviceinstaller,
      # sans passer par TestFlight/App Store.
      - run: flutter build ipa --profile --export-options-plist=ios/ExportOptions-dev.plist

      - uses: actions/upload-artifact@v4
        with:
          name: le10000-ipa-dev
          path: build/ios/ipa/*.ipa
