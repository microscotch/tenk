name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plateforme à builder"
        required: false
        default: all
        type: choice
        options: [all, android, ios]

jobs:
  # Filet de sécurité côté CI pour le hook local .githooks/pre-push : celui-ci
  # ne s'applique qu'à un `git push` passant par un clone local qui a
  # configuré core.hooksPath — un merge de PR ou une édition depuis
  # l'interface GitHub le contournent entièrement. Vérifie donc ici aussi
  # que le build number de pubspec.yaml a bien augmenté par rapport à avant
  # ce push, et le corrige sinon (commit + push direct sur main, avec
  # [skip ci] pour ne pas redéclencher un run en double) avant que
  # build-android/build-ios ne démarrent — les deux dépendent de ce job pour
  # utiliser le commit potentiellement corrigé, sinon iOS et Android
  # partiraient chacun d'un état différent.
  bump-build-number:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifie/incrémente le build number si besoin
        id: resolve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "Pas de commit précédent à comparer, vérification ignorée."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_pubspec=$(git show HEAD:pubspec.yaml)
          base_pubspec=$(git show "$BASE:pubspec.yaml" 2>/dev/null) || base_pubspec=""

          current_build=$(printf '%s\n' "$current_pubspec" | sed -n 's/^version: [0-9]*\.[0-9]*\.[0-9]*+\([0-9]*\)$/\1/p')
          base_build=$(printf '%s\n' "$base_pubspec" | sed -n 's/^version: [0-9]*\.[0-9]*\.[0-9]*+\([0-9]*\)$/\1/p')
          semver=$(printf '%s\n' "$current_pubspec" | sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\)+[0-9]*$/\1/p')

          if [ -z "$current_build" ] || [ -z "$semver" ] || [ -z "$base_build" ]; then
            echo "Ligne 'version:' illisible ou introuvable, vérification ignorée."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$current_build" -gt "$base_build" ]; then
            echo "Build number déjà correct ($current_build > $base_build)."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_build=$((base_build + 1))
          sed -i "s/^version: .*/version: ${semver}+${new_build}/" pubspec.yaml
          git commit pubspec.yaml -m "chore: bump build number (${semver}+${new_build}) [skip ci]"
          git push origin HEAD:main
          echo "Build number corrigé automatiquement : ${semver}+${new_build}."
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-android:
    needs: bump-build-number
    if: ${{ !failure() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android') }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (historique complet) : nécessaire pour lister les
      # commits de ce push via `git log` ci-dessous (notes de version). ref:
      # le commit potentiellement corrigé par bump-build-number, pas
      # forcément celui qui a déclenché le workflow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.bump-build-number.outputs.sha || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Notes de version Play Store = titres des commits `feat:`/`fix:` de ce
      # push (celui dont la fiche apparaît juste avant sur le dépôt distant) :
      # seuls ceux-là parlent à un joueur, contrairement à `chore:`/`docs:`/...
      # (dont le commit de bump de build number, présent sur quasi tous les
      # push). Retombe sur le commit précédent si `before` est absent/inconnu
      # (workflow_dispatch, ou historique local trop court) ; sur le titre du
      # commit HEAD si la plage est vide (re-run sans nouveau commit). Si
      # aucun commit feat:/fix: n'est trouvé (push uniquement chore:/docs:),
      # aucun fichier n'est écrit : les notes de version publiées restent
      # celles déjà en place sur le Play Store plutôt que d'être vidées.
      - name: Prépare les notes de version depuis les titres de commit
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          mkdir -p distribution/whatsnew
          git log --pretty=format:'%s' "$BASE"..HEAD | grep -E '^(feat|fix):' | sed 's/^/- /' > distribution/whatsnew/whatsnew-fr-FR || true
          if [ ! -s distribution/whatsnew/whatsnew-fr-FR ]; then
            git log -1 --pretty=format:'%s' | grep -E '^(feat|fix):' | sed 's/^/- /' > distribution/whatsnew/whatsnew-fr-FR || true
          fi
          if [ -s distribution/whatsnew/whatsnew-fr-FR ]; then
            # Limite imposée par Google Play sur le texte des notes de version.
            head -c 500 distribution/whatsnew/whatsnew-fr-FR > distribution/whatsnew/whatsnew-fr-FR.tmp
            mv distribution/whatsnew/whatsnew-fr-FR.tmp distribution/whatsnew/whatsnew-fr-FR
            cat distribution/whatsnew/whatsnew-fr-FR
          else
            rm -f distribution/whatsnew/whatsnew-fr-FR
            echo "Aucun commit feat:/fix: dans ce push : notes de version Play Store inchangées."
          fi

      # Reconstitue le keystore de release (secret du repo) : sans lui, le
      # build "release" retombe sur la clé debug (cf. android/app/build.gradle.kts)
      # et produit un binaire non signé pour de vrai, inutilisable pour une
      # mise à jour ou une publication sur le Play Store.
      - name: Importe le keystore Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: le10000-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: le10000-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Envoie l'AAB vers Google Play (track "internal") via un compte de
      # service dédié (secret du repo) — indépendant d'une session développeur
      # connectée. Ne bloque pas le job si l'envoi échoue, par exemple à cause
      # d'un versionCode déjà utilisé ou tant que l'app n'a pas encore reçu sa
      # toute première release manuelle depuis la console (prérequis Google
      # avant tout envoi via l'API).
      - name: Envoie vers Google Play (internal)
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.microscotch.games.tenk
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          whatsNewDirectory: distribution/whatsnew

  build-ios:
    needs: bump-build-number
    if: ${{ !failure() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios') }}
    runs-on: macos-latest
    steps:
      # fetch-depth: 0 (historique complet) : nécessaire pour lister les
      # commits de ce push via `git log` ci-dessous (notes "What to Test").
      # ref: le commit potentiellement corrigé par bump-build-number.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.bump-build-number.outputs.sha || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Importe les certificats Apple (distribution + development) et leurs
      # profils de provisionnement (secrets du repo) dans un trousseau macOS
      # temporaire, propre à ce run, pour que les archives puissent être
      # signées sans compte Apple connecté à Xcode.
      - name: Importe la signature Apple
        env:
          DIST_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          DIST_PROFILE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          DEV_P12_BASE64: ${{ secrets.IOS_DEV_P12_BASE64 }}
          DEV_P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
          DEV_PROFILE_BASE64: ${{ secrets.IOS_DEV_MOBILEPROVISION_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          DIST_CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          DIST_PROFILE_PATH="$RUNNER_TEMP/games.mobileprovision"
          DEV_CERTIFICATE_PATH="$RUNNER_TEMP/development.p12"
          DEV_PROFILE_PATH="$RUNNER_TEMP/games-dev.mobileprovision"

          echo -n "$DIST_P12_BASE64" | base64 --decode -o "$DIST_CERTIFICATE_PATH"
          echo -n "$DIST_PROFILE_BASE64" | base64 --decode -o "$DIST_PROFILE_PATH"
          echo -n "$DEV_P12_BASE64" | base64 --decode -o "$DEV_CERTIFICATE_PATH"
          echo -n "$DEV_PROFILE_BASE64" | base64 --decode -o "$DEV_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$DIST_CERTIFICATE_PATH" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$DEV_CERTIFICATE_PATH" -P "$DEV_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$DIST_PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/
          cp "$DEV_PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/

      - run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: le10000-ipa
          path: build/ios/ipa/*.ipa

      # Envoie le build App Store vers App Store Connect (TestFlight) via une
      # clé API dédiée (secrets du repo) — indépendant du compte Apple perso,
      # fonctionne donc aussi sans session Xcode connectée. Notes "What to
      # Test" = titres des commits de ce push (même calcul que les notes de
      # version Play Store, voir job build-android). Passe par
      # `fastlane pilot` plutôt que `xcrun altool` : altool ne permet pas
      # d'attacher ces notes, pilot le fait en un seul envoi via l'API App
      # Store Connect.
      - name: Envoie vers TestFlight
        # Ne bloque pas le reste du job (notamment le build de l'IPA de dev
        # ci-dessous) si l'envoi échoue, par exemple à cause d'un numéro de
        # build déjà utilisé — ce n'est pas la seule chose qui compte dans ce
        # job, et un run n'a pas toujours vocation à produire un nouveau
        # build TestFlight.
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          # fastlane attend la clé API sous forme de fichier JSON (contenu du
          # .p8 inclus tel quel) plutôt que le .p8 seul comme altool.
          API_KEY_JSON="$RUNNER_TEMP/asc_api_key.json"
          jq -n --arg key_id "$ASC_KEY_ID" --arg issuer_id "$ASC_ISSUER_ID" --arg key "$(cat "$KEY_PATH")" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key}' > "$API_KEY_JSON"

          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          CHANGELOG=$(git log --pretty=format:'- %s' "$BASE"..HEAD)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(git log -1 --pretty=format:'- %s')
          fi
          # Limite large côté App Store Connect sur le texte "What to Test".
          CHANGELOG=$(printf '%s' "$CHANGELOG" | head -c 3900)

          command -v fastlane >/dev/null 2>&1 || gem install fastlane --no-document

          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n1)
          fastlane pilot upload \
            --api_key_path "$API_KEY_JSON" \
            --app_identifier net.microscotch.games.tenk \
            --ipa "$IPA_PATH" \
            --changelog "$CHANGELOG" \
            --skip_waiting_for_build_processing true

      # Build signé avec le profil Development (inclut l'UDID d'un appareil de
      # test précis) : installable directement par USB via ideviceinstaller,
      # sans passer par TestFlight/App Store.
      - run: flutter build ipa --profile --export-options-plist=ios/ExportOptions-dev.plist

      - uses: actions/upload-artifact@v4
        with:
          name: le10000-ipa-dev
          path: build/ios/ipa/*.ipa
