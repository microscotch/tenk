# Le serveur des parties en ligne, à partir de l'image publiée par la CI.
#   docker compose -f server/docker-compose.yml up -d
#   docker compose -f server/docker-compose.yml pull && docker compose -f server/docker-compose.yml up -d   # mise à jour
#
# Pour construire l'image ici plutôt que la tirer (contexte = RACINE du dépôt,
# le serveur réutilise le moteur de lib/game) :
#   build: { context: .., dockerfile: server/Dockerfile }
services:
  tenk-server:
    image: ghcr.io/microscotch/tenk-server:latest
    container_name: tenk-server
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"   # lit X-Forwarded-For : le proxy TLS est devant
      # Certificats de l'application Android, pour que les liens d'invitation l'ouvrent
      # (/.well-known/assetlinks.json). Séparés par des virgules :
      # - la clé d'envoi : les APK de la CI, installés à la main ;
      # - la clé avec laquelle Google Play signe l'app qu'il distribue. Sans elle, les
      #   liens de l'app installée depuis le Play Store s'ouvrent dans le navigateur.
      #   La relever sur l'appareil plutôt que dans la console (dont les empreintes
      #   copiées ne correspondaient pas) : `adb shell pm get-app-links
      #   net.microscotch.games.tenk`, ligne « Signatures » — le domaine doit y passer
      #   à « verified » après `pm verify-app-links --re-verify`.
      TENK_ANDROID_CERT_SHA256: "77:08:53:43:37:59:37:34:41:E3:E4:41:45:0B:9E:19:69:B0:24:85:93:37:84:29:56:CC:3E:92:66:80:79:EC,AB:66:18:EF:08:EF:2C:B0:DB:BD:C4:72:9B:1F:2D:11:C9:58:9D:AB:DE:8F:91:3A:4B:1A:74:05:0A:A7:AC:E0"
      # PORT: "8080"     # défaut
      # HOST: "0.0.0.0"  # défaut
      # Dernier build de chaque store, relayé sur /latest-build (mise à jour proposée
      # au lancement). Défaut : le latest.json de la branche store-builds ; "" coupe la route.
      # TENK_LATEST_BUILDS_URL: "https://raw.githubusercontent.com/microscotch/tenk/store-builds/latest.json"
    # Aucun port publié : le reverse proxy (Apache, lui aussi un conteneur) joint
    # tenk-server:8080 par le réseau partagé ci-dessous et expose wss://…/ws.
    # TRUST_PROXY=1 n'est sûr que si le proxy est le seul à pouvoir joindre ce
    # port : ne rattache à ce réseau que des conteneurs de confiance.
    expose:
      - "8080"
    networks:
      - backend
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: none   # pas de journaux (voir la politique de confidentialité) ; json-file le temps d'un dépannage

# Le réseau du conteneur Apache, créé ailleurs.
# Dans le vhost : ProxyPass "/ws" "ws://tenk-server:8080/ws", et pour les liens
# d'invitation ProxyPass "/.well-known/" "http://tenk-server:8080/.well-known/" et
# ProxyPass "/j/" "http://tenk-server:8080/j/" (sans redirection : iOS refuse d'en
# suivre une pour apple-app-site-association).
networks:
  backend:
    external: true
    name: backend
